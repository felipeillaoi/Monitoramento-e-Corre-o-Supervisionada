[dependency-groups]
runtime = [
    "pysnmp==7.1.28",
    "cryptography==50.0.1",
    "pyasn1==0.6.4",
    "cffi==2.1.1",
    "pycparser==3.0",
]
desenvolvimento = [
    { include-group = "runtime" },
    "ruff==0.14.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
